[project]
name = "truck-routing-backend"
version = "0.1.0"
description = "Weather-aware truck routing API"
requires-python = ">=3.12"
dependencies = [
    "django==5.2.18",
    "djangorestframework==3.18.3",
    "django-environ==0.14.0",
    "requests==2.34.2",
    "gunicorn==26.2.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "responses==0.26.3",
    "ruff==0.17.1",
    "pre-commit==4.7.0",
]

[tool.uv]
# An application, not a library: install dependencies only.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "DJ",  # flake8-django
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--strict-markers"
