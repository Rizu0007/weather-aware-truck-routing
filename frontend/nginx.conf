# Mirrors vercel.json for local Docker runs: static SPA + /api proxied to Django.
server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types application/json application/javascript text/javascript text/css image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;  # same ceiling as Vercel's external rewrites
    }

    # Hashed build output never changes, so it can be cached for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
